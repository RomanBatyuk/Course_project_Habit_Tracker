name: Deploy Django Project
on:
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: base_one
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 3
          done
      - name: Wait for Redis
        run: |
         until docker exec $(docker ps -q -f ancestor=redis:7) redis-cli ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 3
          done
      - name: Run migrations
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_API_VERSION: ${{ secrets.STRIPE_API_VERSION }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
            python manage.py migrate
          

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to YandexCloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app/Course_project_Habit_Tracker || mkdir -p /home/${{ secrets.SERVER_USER }}/app/Course_project_Habit_Tracker && cd /home/${{ secrets.SERVER_USER }}/app/Course_project_Habit_Tracker
            cat << 'EOF' > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            
            # Django
            DEBUG=True
            
            # Stripe
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_API_VERSION=${{ secrets.STRIPE_API_VERSION }}
            
            # Redis
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_DB=${{ secrets.REDIS_DB }}

            EOF
            
            # Останавливаем старые контейнеры, если они есть
            sudo docker compose down || true
            # Подтягиваем свежий код
            git pull origin feature || git clone -b feature git@github.com:${{ github.repository }}.git .
            # Собираем и запускаем контейнеры
            sudo docker compose up -d --build