name: Deploy Django Project
on:
  push:
    branches: [ "feature_ci" ]
  pull_request:
    branches: [ "feature_ci" ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        env:
          DEBUG: True
          DATABASE_NAME: db.sqlite3
        run: |
            python manage.py migrate
            python manage.py test



  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature_ci

      - name: Deploy to YandexCloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Course_project_Habit_Tracker

            # Останавливаем контейнеры если есть docker-compose.yml
            if [ -f "docker-compose.yml" ]; then
              sudo docker compose down || true
            fi

            # Инициализируем git репозиторий если его нет
            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # Принудительно обновляем код
            git fetch origin
            git checkout -B feature_ci origin/feature_ci
            git reset --hard origin/feature_ci

            # Запускаем контейнеры
            sudo docker compose up -d --build