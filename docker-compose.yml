services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: habit_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d habit_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    entrypoint: ""  # Добавляем, чтобы migrate/collectstatic для celery (опционально)
    command: ["celery", "-A", "habit", "worker", "--loglevel=info"]  # Замените на ваше приложение
    volumes:
      - .:/app  # Изменено с /code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - HOST=db
      - POSTGRES_DB=habit_tracker
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  web:
    build: .
    entrypoint: /app/entrypoint.sh
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app  # Добавлено для hot-reload кода в development
      - staticfiles:/app/static
      - media:/app/media
    ports:
      - "8080:8000"  # Изменено для избежания блокировки (внешний доступ на 8080, если нужно напрямую)
    depends_on:
      db:
        condition: service_healthy  # Добавлено
      redis:
        condition: service_healthy  # Добавлено
    env_file:
      - .env
    environment:
      - HOST=db
      - POSTGRES_DB=habit_tracker
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  nginx:
    image: nginx:stable-alpine  # Используем готовый образ вместо build
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started  # Улучшено: ждём запуска web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Добавлено: монтируем конфиг
      - staticfiles:/app/static
      - media:/app/media

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
